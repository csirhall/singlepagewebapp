<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Favorite Foods Organizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 70%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 8px 12px;
      margin-left: 5px;
      background-color: #4CAF50;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin-top: 20px;
      text-align: left;
    }

    li {
      padding: 6px 8px;
      background: #f1f1f1;
      margin-bottom: 5px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Favorite Foods</h1>
    <input type="text" id="foodInput" placeholder="Enter a food">
    <button onclick="addFood()">Add</button>
    <ul id="foodList"></ul>
  </div>

  <script>
    let foods = [];

    function addFood() {
      const input = document.getElementById("foodInput");
      const food = input.value.trim();

      if (food) {
        foods.push(food);
        foods.sort((a, b) => a.localeCompare(b)); // Alphabetical order
        displayFoods();
        input.value = "";
      }
    }

    function displayFoods() {
      const list = document.getElementById("foodList");
      list.innerHTML = "";

      foods.forEach(food => {
        const li = document.createElement("li");
        li.textContent = food;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
